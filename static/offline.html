<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c0a14">
    <title>Sin conexión · Biblioteca de Prozac</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0c0a14; color: #f3f0fa; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; }
        h1 { font-family: Georgia, serif; font-size: 32px; background: linear-gradient(90deg, #c084fc, #f472b6); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0 0 12px; }
        p { color: #a39cba; max-width: 420px; line-height: 1.5; }
        button { background: #c084fc; color: #16081f; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    </style>
</head>
<body>
    <div>
        <h1>Sin conexión</h1>
        <p>No se puede llegar al servidor ahora mismo. Las páginas que ya visitaste y las portadas guardadas siguen disponibles; la música y los archivos necesitan internet.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
